name: Deploy CMS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04 # Match EC2 OS to ensure binary compatibility (better-sqlite3)
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Admin Panel
        run: npm run build

      - name: Prune Development Dependencies
        run: npm prune --production

      - name: Compress Artifacts
        run: tar -czf deploy.tar.gz dist node_modules package.json package-lock.json public database config src favicon.png

      - name: Copy Artifacts to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CMS_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.CMS_EC2_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "/home/ubuntu"
          overwrite: true
          timeout: 120s

      - name: Start Application on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CMS_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.CMS_EC2_SSH_KEY }}
          script: |
            # Move artifact to app directory (using sudo for permissions)
            sudo mkdir -p /opt/portfolio-cms
            sudo chown -R ubuntu:ubuntu /opt/portfolio-cms
            mv /home/ubuntu/deploy.tar.gz /opt/portfolio-cms/deploy.tar.gz

            cd /opt/portfolio-cms
            
            # Clean previous artifacts to ensure fresh install
            rm -rf node_modules dist build src config database public package.json package-lock.json

            # Extract Artifacts
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz

            # Create/Overwrite .env file with production secrets
            echo "${{ secrets.ENV_PRODUCTION }}" > .env

            # Start/Reload PM2 (Standard Start)
            if pm2 list | grep -q "portfolio-cms"; then
              pm2 reload portfolio-cms
            else
              pm2 start npm --name "portfolio-cms" -- start
            fi
            
            pm2 save