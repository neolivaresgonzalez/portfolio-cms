name: Deploy Strapi Docker to EC2

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.github/**'

permissions:
  packages: write
  contents: read

jobs:
  build:
    name: Build Host Artifacts
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Admin Panel
        run: npm run build

      # We do NOT prune here because Docker will install its own production deps for Alpine
      # We just prepare the artifacts needed for the Docker context

      - name: Compress Build Context
        # Bundling everything needed for the Docker build
        run: tar -czf build-context.tar.gz dist public database favicon.png package.json package-lock.json Dockerfile

      - name: Upload Build Context
        uses: actions/upload-artifact@v4
        with:
          name: build-context
          path: build-context.tar.gz
          retention-days: 1

  docker-build:
    name: Build & Push Docker Image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Context
        uses: actions/download-artifact@v4
        with:
          name: build-context

      - name: Extract Context
        run: tar -xzf build-context.tar.gz

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    name: Deploy to EC2
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CMS_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.CMS_EC2_SSH_KEY }}
          script: |
            # 1. Login to GHCR (using ephemeral token)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 2. Pull the latest image
            docker pull ghcr.io/${{ github.repository }}:latest

            # 3. Stop and Remove existing container
            docker stop portfolio-cms || true
            docker rm portfolio-cms || true

            # 4. Prepare Server Directories
            sudo mkdir -p /opt/portfolio-cms/database
            sudo chown -R ubuntu:ubuntu /opt/portfolio-cms
            
            # 5. Create .env file
            echo "${{ secrets.ENV_PRODUCTION }}" > /opt/portfolio-cms/.env
            
            # 6. Fix DATABASE_FILENAME for Docker internal path
            # We mount local /opt/portfolio-cms/database to /app/database
            sed -i 's|DATABASE_FILENAME=.*|DATABASE_FILENAME=/app/database/data.db|g' /opt/portfolio-cms/.env

            # 7. Run Container
            # -v /opt/portfolio-cms/database:/app/database : Persist SQLite DB
            # --env-file : Inject environment variables
            # --restart unless-stopped : Auto-restart on crash/reboot
            docker run -d \
              --name portfolio-cms \
              --restart unless-stopped \
              -p 1337:1337 \
              --env-file /opt/portfolio-cms/.env \
              -v /opt/portfolio-cms/database:/app/database \
              ghcr.io/${{ github.repository }}:latest
            
            # 8. Clean up unused images
            docker image prune -f