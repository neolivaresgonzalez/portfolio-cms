name: Deploy CMS (prod)

on:
  push:
    branches: [ main ]
    paths:
      - "Dockerfile"
      - "docker-compose.prod.yml"
      - "Caddyfile"
      - "src/**"
      - "config/**"
      - "types/**"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate required secrets (client-side)
        run: |
          # Comprueba explícitamente cada secreto (no se puede indexar secrets con una variable)
          if [ -z "${{ secrets.PROD_SSH_HOST }}" ] || [ -z "${{ secrets.PROD_SSH_USER }}" ] || [ -z "${{ secrets.PROD_SSH_KEY }}" ]; then
            echo "One or more required SSH secrets (PROD_SSH_HOST, PROD_SSH_USER, PROD_SSH_KEY) are missing. Aborting."
            exit 1
          fi
          if [ -z "${{ secrets.ENV_PRODUCTION }}" ]; then
            echo "ENV_PRODUCTION secret is missing. Aborting."
            exit 1
          fi
          echo "Required secrets present. Proceeding with deploy."

      - name: Deploy via SSH (pull pre-built image and run)
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -euo pipefail

            cd /opt/portfolio-cms || mkdir -p /opt/portfolio-cms && cd /opt/portfolio-cms

            # Update local repo files (keep existing repo for non-build assets)
            if [ -d .git ]; then
              git fetch --all
              git reset --hard origin/main
            else
              git clone https://github.com/neolivaresgonzalez/portfolio-cms.git .
            fi

            # Ensure .env.production exists (it is written from the secret by the action previously)
            printf '%s\n' "${{ secrets.ENV_PRODUCTION }}" > .env.production
            sync

            # Basic validation on remote host: ensure DOMAIN var exists in .env.production
            if grep -qE '^DOMAIN=' .env.production; then
              echo "DOMAIN variable present in .env.production"
            else
              echo "DOMAIN is missing from .env.production — deployment may fail. Aborting."
              exit 1
            fi

            # Authenticate to GHCR so we can pull private images (requires secrets on repo)
            if [ -n "${{ secrets.GHCR_USERNAME }}" ] && [ -n "${{ secrets.GHCR_PAT }}" ]; then
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            fi

            # Pull the latest image and deploy (no build)
            docker pull ghcr.io/neolivaresgonzalez/portfolio-cms:latest || true
            if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
              DOCKER_COMPOSE_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              DOCKER_COMPOSE_CMD="docker-compose"
            else
              echo "No docker compose command found. Aborting."
              exit 1
            fi

            $DOCKER_COMPOSE_CMD -f docker-compose.prod.yml up -d
            docker image prune -f || true
            $DOCKER_COMPOSE_CMD -f docker-compose.prod.yml ps