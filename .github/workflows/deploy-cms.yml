name: Deploy CMS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Admin Panel (on GitHub Runner)
        run: npm run build

      - name: Copy Artifacts to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CMS_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.CMS_EC2_SSH_KEY }}
          source: "dist,package.json,package-lock.json,public,database,config,src,favicon.ico"
          target: "/opt/portfolio-cms"
          strip_components: 0

      - name: Start Application on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CMS_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.CMS_EC2_SSH_KEY }}
          script: |
            cd /opt/portfolio-cms
            
            # Create/Overwrite .env file with production secrets
            echo "${{ secrets.ENV_PRODUCTION }}" > .env

            # Install ONLY production dependencies
            npm ci --omit=dev

            # Start/Reload PM2 (Standard Start)
            if pm2 list | grep -q "portfolio-cms"; then
              pm2 reload portfolio-cms
            else
              pm2 start npm --name "portfolio-cms" -- start
            fi
            
            pm2 save