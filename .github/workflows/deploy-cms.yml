name: Deploy Strapi Docker to EC2

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  packages: write
  contents: read

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Docker Compose to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CMS_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.CMS_EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CMS_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.CMS_EC2_SSH_KEY }}
          script: |
            # Move docker-compose.yml to the correct location and fix permissions
            sudo mkdir -p /opt/portfolio-cms
            sudo chown ubuntu:ubuntu /opt/portfolio-cms
            mv /home/ubuntu/docker-compose.yml /opt/portfolio-cms/docker-compose.yml
            
            # 1. Install Docker if missing
            if ! command -v docker &> /dev/null; then
              echo "Docker not found. Installing..."
              sudo apt-get update
              sudo apt-get install -y ca-certificates curl gnupg
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg --yes
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              echo \
                "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
                $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | \
                sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              sudo usermod -aG docker ubuntu
            fi

            # 2. Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 3. Prepare Environment
            cd /opt/portfolio-cms
            # Create .env from secrets
            echo "${{ secrets.ENV_PRODUCTION }}" > .env
            
            # 4. Deploy with Docker Compose
            # Export repository name for variable substitution in compose file
            export GITHUB_REPOSITORY=${{ github.repository }}
            
            # Kill previous containers to prevent conflicts (port 1337)
            # This handles both the old standalone container and previous compose runs
            docker stop portfolio-cms || true
            docker rm portfolio-cms || true
            docker compose -f docker-compose.yml down --remove-orphans || true
            
            # Pull latest images
            docker compose -f docker-compose.yml pull
            
            # Start services
            docker compose -f docker-compose.yml up -d --remove-orphans
            
            # Cleanup
            docker system prune -af