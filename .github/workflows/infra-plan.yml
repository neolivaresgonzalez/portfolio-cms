# infra-plan.yml: hace terraform init/plan y sube el plan como artifact para revisión.
name: Infra — Plan

on:
  push:
    paths:
      - "infra/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (if provided)
        if: ${{ secrets.AWS_ACCESS_KEY_ID && secrets.AWS_SECRET_ACCESS_KEY && secrets.AWS_REGION }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.0'

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate || true

      - name: Terraform plan (detailed exitcode)
        id: plan
        run: |
          set -euo pipefail
          # produce plan file and exit code info
          terraform plan -out=tfplan -detailed-exitcode || echo "PLAN_EXIT_CODE=$?" > plan_exit.txt || true
          # ensure a file exists for plan_exit
          if [ ! -f plan_exit.txt ]; then
            echo "PLAN_EXIT_CODE=0" > plan_exit.txt
          fi
          terraform show -no-color tfplan > tfplan.txt || true
          cat plan_exit.txt
        shell: bash

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}
          path: |
            infra/tfplan
            infra/tfplan.txt
            infra/plan_exit.txt
        continue-on-error: true

      - name: Print summary (logs)
        run: |
          echo "Plan artifact uploaded: terraform-plan-${{ github.sha }}"
          echo "Check the plan artifact or loginfrs to review proposed changes."