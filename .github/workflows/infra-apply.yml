# infra-apply.yml: apply manual protegido por Environment approval (pausa para revisión).
name: Infra — Apply (manual, approved)

on:
  workflow_dispatch:
    inputs:
      auto_trigger_build:
        description: 'Trigger build-and-push after successful apply? (true/false)'
        required: false
        default: 'true'

permissions:
  contents: read
  id-token: write
  # permissions to dispatch other workflows
  actions: write

jobs:
  terraform-apply:
    name: Terraform apply (requires environment approval)
    runs-on: ubuntu-latest
    environment: production   # <-- set up Environment protections in repo settings (required reviewers)
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.0'

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply (auto-approve)
        id: apply
        run: |
          set -euo pipefail
          terraform plan -out=tfplan || true
          terraform apply -auto-approve tfplan
        shell: bash

      - name: Optionally trigger build-and-push
        if: ${{ github.event.inputs.auto_trigger_build == 'true' }}
        run: |
          echo "Triggering build-and-push workflow"
          API="https://api.github.com/repos/portfolio-cms/actions/workflows/build-and-push.yml/dispatches"
          curl -X POST -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}' \
            "$API"
        shell: bash