version: '3'
services:
  portfolio-cms:
    container_name: portfolio-cms
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_CLIENT: mysql
      DATABASE_HOST: portfolio-cmsDB
      DATABASE_PORT: 3306
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      # DATABASE_PASSWORD must be provided in .env
      NODE_ENV: production
      HOST: '0.0.0.0'
      PORT: 1337
    ports:
      - '1337:1337'
    networks:
      - portfolio-cms
    depends_on:
      - portfolio-cmsDB

  portfolio-cmsDB:
    container_name: portfolio-cmsDB
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_USER: strapi
      MYSQL_DATABASE: strapi
      # MYSQL_PASSWORD and MYSQL_ROOT_PASSWORD must be provided in .env (mapped from DATABASE_PASSWORD)
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - portfolio-cms-data:/var/lib/mysql
    networks:
      - portfolio-cms

volumes:
  portfolio-cms-data:


networks:
  portfolio-cms:
    driver: bridge
